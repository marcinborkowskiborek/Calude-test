<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADS CRM Automation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 320px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 200px;
        }

        .container {
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header .version {
            font-size: 11px;
            opacity: 0.8;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .schema-input {
            margin-bottom: 16px;
        }

        .schema-input label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .schema-input input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .schema-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-icon {
            width: 18px;
            height: 18px;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }

        .steps {
            margin-top: 16px;
            font-size: 11px;
            color: #888;
        }

        .steps-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #666;
        }

        .steps ol {
            padding-left: 16px;
        }

        .steps li {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .footer {
            margin-top: 16px;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SADS CRM Automation</h1>
            <div class="version">v2.0.0</div>
        </div>

        <div class="card">
            <div class="schema-input">
                <label for="schemaName">Nazwa schematu:</label>
                <input type="text" id="schemaName" value="Marcin Borkowski Nowe" placeholder="Wpisz nazwę schematu">
            </div>

            <button class="btn btn-primary" id="runBtn">
                <svg class="btn-icon" id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="btn-icon spinner" id="loadingIcon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
                </svg>
                <span id="btnText">Uruchom automatyzację</span>
            </button>

            <div class="status" id="status"></div>

            <div class="steps">
                <div class="steps-title">Kroki automatyzacji:</div>
                <ol>
                    <li>Kliknij "Powiadomienia i schematy"</li>
                    <li>Poczekaj na modal CRM</li>
                    <li>Znajdź wiersz ze schematem</li>
                    <li>Kliknij przycisk "Wyszukaj"</li>
                </ol>
            </div>
        </div>

        <div class="footer">
            SADS CRM Automation by Marcin Borkowski
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
