<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#03A9F4"/>
      <stop offset="100%" style="stop-color:#0288D1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <g fill="white">
    <!-- Robot head -->
    <rect x="25" y="20" width="50" height="40" rx="8"/>
    <!-- Eyes -->
    <circle cx="38" cy="38" r="6" fill="#03A9F4"/>
    <circle cx="62" cy="38" r="6" fill="#03A9F4"/>
    <circle cx="38" cy="38" r="3" fill="#0288D1"/>
    <circle cx="62" cy="38" r="3" fill="#0288D1"/>
    <!-- Antenna -->
    <rect x="47" y="10" width="6" height="12" rx="2"/>
    <circle cx="50" cy="10" r="5"/>
    <!-- Body -->
    <rect x="30" y="65" width="40" height="25" rx="5"/>
    <!-- Task lines on body -->
    <rect x="36" y="72" width="20" height="3" rx="1" fill="#03A9F4"/>
    <rect x="36" y="78" width="15" height="3" rx="1" fill="#03A9F4"/>
    <rect x="36" y="84" width="25" height="3" rx="1" fill="#03A9F4"/>
  </g>
</svg>
